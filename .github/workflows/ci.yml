name: C-SAGE CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
        env:
          DJANGO_DEBUG: 'true'
      - run: python manage.py test
        env:
          DJANGO_DEBUG: 'true'
      - run: docker build -t c-sage:${{ github.sha }} .
